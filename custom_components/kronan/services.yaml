add_to_cart:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: kronan
    sku:
      example: "100123"
      selector:
        text:
    quantity:
      default: 1
      selector:
        number:
          min: 1
          max: 500
          mode: box
    items:
      example: '[{"sku": "100123", "quantity": 2}]'
      selector:
        object:

set_cart_quantity:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: kronan
    sku:
      required: true
      example: "100123"
      selector:
        text:
    quantity:
      required: true
      selector:
        number:
          min: 0
          max: 500
          mode: box

get_orders:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: kronan
    limit:
      default: 10
      selector:
        number:
          min: 1
          max: 50
          mode: box

get_order:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: kronan
    order_token:
      required: true
      selector:
        text:

get_favorites:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: kronan
    sort:
      default: most_frequent
      selector:
        select:
          options:
            - most_frequent
            - most_quantity
            - recent
          translation_key: purchase_sort
    limit:
      default: 40
      selector:
        number:
          min: 1
          max: 100
          mode: box

get_delivery_slots:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: kronan
    address_id:
      selector:
        number:
          min: 1
          max: 999999999
          mode: box

reserve_delivery_slot:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: kronan
    slot_id:
      required: true
      selector:
        number:
          min: 1
          max: 999999999
          mode: box
    address_id:
      selector:
        number:
          min: 1
          max: 999999999
          mode: box
    return_bags:
      default: false
      selector:
        boolean:

add_cart_to_order:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: kronan
